name: pre-commit

on:
  merge_group: ~
  workflow_dispatch: ~
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # This public repository's GitHub Actions token cannot read the private
      # elastic/gitleaks-hooks repository. Buildkite runs the canonical
      # Gitleaks hook; this job preserves the existing public-only hook set.
      - name: Run public pre-commit hooks on pull requests
        if: ${{ github.event.pull_request }}
        run: >-
          ./bin/pre-commit run
          --config .pre-commit-config.github-actions.yaml
          --show-diff-on-failure
          --color=always
          --from-ref ${{ github.event.pull_request.base.sha }}
          --to-ref ${{ github.event.pull_request.head.sha }}

      - name: Run public pre-commit hooks on branches
        if: ${{ ! github.event.pull_request }}
        run: >-
          ./bin/pre-commit run
          --config .pre-commit-config.github-actions.yaml
          --show-diff-on-failure
          --color=always
          --all-files
